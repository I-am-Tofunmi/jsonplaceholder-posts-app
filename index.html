<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Posts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <nav>
        <h3 id="psts">Blog Posts</h3>
        <ul class="first_list">
            <li>Articles</li>
            <li>About</li>
            <li>Newsletter</li>
        </ul>
        <button>Subscribe</button>
    </nav>
    <div id="main-content">
        <input id="search" placeholder="Search for articles...">
        <h3 id="mn">Perspectives on design and deep focus.</h3>
    </div>
    <div id="loading">Loading...</div>
    <div id="error">Couldn't load posts.</div>
    <div id="empty">No posts match.</div>
    <div id="article"></div>
    <div id="footer">
        <h4>MODERN MINIMALISM</h4>
        <ul id="list">
            <li>Privacy Policy</li>
            <li>Terms of Service</li>
            <li>RSS Feed</li>
        </ul>
        <p>@ 2026 Modern Minimalism. Built for deep thought.</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
